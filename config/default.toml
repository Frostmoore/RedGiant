# Red Giant — configurazione di default (piano §A6).
# I profili in config/profiles/*.toml sovrascrivono solo le chiavi che differiscono.
# llama.cpp pin (F0.2) — cambiarli = rifare bench F0.5:
#   riferimento (severino-sim/severino): immagine ghcr b10200, digest sha256:8b7f05d7...e98db
#   dev Windows (dev-fast + probe): release b10217 (b10200 non ha asset Windows)
# modello: unsloth/gemma-4-E2B-it-qat-GGUF / gemma-4-E2B-it-qat-UD-Q4_K_XL.gguf (QAT Q4)

# ── Decisioni F0.6, derivate dal bench F0.5 su severino-sim (2 core ≈ Severino 4 core) ──
# prefill freddo: 1K=6.8s · 4K=30.7s · 8K=69.6s · 16K=173.6s | generazione: 35.8 tok/s
# riuso prefisso: append=65 tok riprocessati vs 7971 con 1 byte cambiato a meta' (D9 provata)
# slot save/restore: API ok ma riuso post-restore NON funzionante su b10200 -> rivalutare in F5.4
#   -> ctx_size 8192 CONFERMATO (8K freddo=70s tollerabile solo a inizio task; 16K=3min no);
#      regime di lavoro atteso <=6K per chiamata, il freddo si paga una volta grazie a D9/D20
#   -> budget generazione per ruolo (F1+): worker_step=512, planner=1536, phase_designer=2048,
#      debugger=768, supervisor=512 (dalle misure della sonda F0.3, con margine ~2x)
#   -> preambolo S1-S3: tetto 1500 token (~10-13s pagati solo a freddo, poi ammortizzati)
#   -> timeout 600s CONFERMATO (caso peggiore osservato ~230s: prefill 16K + gen 2048)
#   -> reuse_ratio target provvisorio Worker >=0.6 (formalizzato in F5.6)
[llm]
base_url = "http://127.0.0.1:8080"   # endpoint llama-server del profilo
ctx_size = 8192                      # tetto duro per chiamata (D8; confermato da F0.5/F0.6)
timeout_s = 600                      # alto: su CPU una chiamata lunga e' normale, non un errore
temperature = 0.2                    # default; override per ruolo in futuro [roles.<name>]
max_tokens_default = 1024            # tetto generazione se il ruolo non specifica
# TH0: canale di pensiero di Gemma 4 — marcatori estratti dal chat template
# INCORPORATO nel GGUF pinnato (tokenizer.chat_template: '<|channel>thought' /
# '<channel|>'; l'interruttore nativo <|think|> e' token di controllo id 98,
# non necessario col two-call: il canale lo apriamo noi). Trap TH-1 rispettata.
think_open = "<|channel>thought\n"
think_close = "<channel|>"
idle_shutdown_s = 1800               # F2.5 (decisione utente): il server gestito si spegne
                                     # dopo 30 min di inutilizzo — non a ogni fine task
                                     # (ricaricare i pesi a ogni ciclo costa ~1 min)

[paths]
db = "data/redgiant.db"
models_dir = "models/"
tasks_dir = "data/tasks/"            # log e artefatti per task
slots_dir = "data/slots/"            # (F5) KV salvate
ripgrep = "rg"                       # binario di sistema

[budget]                             # default per task; l'Assessor (F6) li modula
# 64000: tampone dichiarato (F2.5, richiesta utente: 32k troppo basso coi cicli di
# approvazione). Taratura seria in F6 (budget adattivi) coi numeri dell'Evaluator.
# A esaurimento NON si fallisce: si chiede all'utente l'estensione (+50%).
max_total_tokens = 64000
max_tool_calls = 100
max_retries_per_subtask = 2          # specsheet §13
max_wall_s = 7200

[worker]
max_steps = 20                       # passi ReAct per sottofase (D20)
step_max_tokens = 768                # F2.5: 512 troncava gli edit lunghi (~21s/step a 35.8 tok/s)

[planner]
enabled = false                      # verdetto D11 (A/B 2026-08-02: baseline 9/10 vs
                                     # planner 2/10 sui micro-task): OFF di default,
                                     # piano ingenuo 1-fase; redesign in
                                     # memory/plan_planner_system.md; riaccensione = F6

[plansys]                            # plan_planner_system.md §PS-A4
enabled = false                      # PS-D9: si accende solo per A/B espliciti finche' non vince
max_phases = 6
max_micro_per_phase = 6
projection_max_tokens = 2500         # budget della Phase Context Projection (dentro D8)
m_pass_max_tokens = 2048             # M1/M2/M3 (1024 troncava M2 in PS4.3; 1536 troncava M2 sul T041 esteso a 3 moduli, GPU dry-run PS6)
test_author_max_tokens = 4096        # M4 scrive file interi (2048 troncava in PS4.3; 3072 = p95 nell'audit budget A/B PS6 — regola: cap >= 1.5x p95)
mutation_probe = false               # PS-D5: probe assert-flip opzionale (costa run extra)

[web]
host = "127.0.0.1"
port = 8090

[security]
writable_globs = []                  # riempito per task, mai globale
shell_whitelist = ["pytest", "php", "composer", "git", "python"]

[eval]
tasks_dir = "redgiant/eval/tasks"
